# Task AM: M0 guard + full pytest. Third-party actions are pinned to a 40-character
# commit SHA (tag in the trailing comment). Do not retarget those tags.
name: Guard and tests

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install -r requirements-dev.txt
      - name: Guard
        run: python scripts/guard.py --require-git
      - name: Pytest
        run: python -m pytest
